        <!-- Navbar Area -->
        <div class="oneMusic-main-menu">

                    <!-- Menu -->

    <!--go back icon-->
    

    <section style="margin-top: 140px;">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <a href="musicgroup.html" class="btn btn-primary mt-3" style="background-color: #000; color: #fff; border: 1px solid #fff;">
                        <i class="fa fa-arrow-left"></i> Back
                    </a>
                </div>
            </div>
        </div>
        <div class="container px-4 py-4" id="view-item">
            <div class="d-flex justify-content-between align-items-center pb-2 border-bottom mb-4">
                <h2 class="mb-0">Music Group Details</h2>
                 <div class="col-sm-5" style="background: white; height: 3vh;">
                    <span id="musicgroupID" style="font-size: 1.2rem;" >123</span> <br>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">
                    <form class="needs-validation" novalidate>
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <h4 for="groupName" class="form-label fw-semibold">Group Name</h4>
                                <div style="background: white; height: 3.5vh; border-radius: 2px;">
                                    <span id="groupName" style="font-size: 1.2rem; padding: 10px;" >AC/DC</span>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <h4 for="genre" class="form-label fw-semibold">Genre</h4>
                                <div style="background: white; height: 3.5vh; border-radius: 2px;">
                                    <span id="groupGenre" style="font-size: 1.2rem; padding: 10px;" >Rock</span>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <h4 for="established" class="form-label fw-semibold" style="margin-top: 12px;">Established Year</h4>
                                <div style="background: white; height: 3.5vh; border-radius: 2px;">
                                    <span id="groupEstablished" style="font-size: 1.2rem; padding: 10px;" >1970</span>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <h4 class="fw-semibold mb-3">Artists</h4>
                            <div class="table-responsive">
                                <table class="table table-bordered table-sm mb-0" id="artistsName">
                                    <thead class="table-light">
                                        <tr>
                                            <th scope="col" style="font-size: 1.2rem;">Name</th>
                                        </tr>
                                    </thead>
                                    <tbody>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div>
                            <h4 class="fw-semibold mb-3">Albums</h4>
                            <div class="table-responsive">
                                <table class="table table-bordered table-sm mb-0" id="albumsName">
                                    <thead class="table-light">
                                        <tr>
                                            <th scope="col"  style="font-size: 1.2rem;">Name</th>
                                            <th scope="col"  style="font-size: 1.2rem;">Year</th>
                                            <th scope="col"  style="font-size: 1.2rem;">Sold Copies</th>
                                        </tr>
                                    </thead>
                                    <tbody>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="mt-4 d-flex justify-content-end gap-2">
                            <button type="button" class="btn m-2" style="background-color: #000; color: #fff; border: 1px solid #fff;">Edit</button>
                            <button type="button" id="deleteButton" class="btn m-2" style="background-color: #fff; color: #000; border: 1px solid #000;">Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <div id="albumsNam">

    </div>
